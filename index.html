  html, body {

  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* Stage: full viewport */
  #root { height: 100%; }

  /* Phone frame visible on desktop only */
  .cm-stage {
    width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 30%, #182838 0%, #050a12 75%);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .cm-phone {
    width: 100%; height: 100%;
    background: #0D1B2A;
    position: relative; overflow: hidden;
  }
  /* The design canvas — always 390x844 logical px; scaled by JS */
  .cm-canvas {
    position: absolute; top: 50%; left: 50%;
    width: 390px; height: 844px;
    transform-origin: center center;
    /* scale set inline by JS via CSS var --cm-fit */
    transform: translate(-50%, -50%) scale(var(--cm-fit, 1));
  }
  @media (min-width: 600px) {
    .cm-stage { padding: 28px; }
    .cm-phone {
      width: 390px; height: min(844px, calc(100vh - 56px));
      max-height: 844px;
      border-radius: 48px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.55), 0 0 0 10px #1a1a1a, 0 0 0 11px #2a2a2a;

    .cm-phone::before {
      /* dynamic island */
      content: ""; position: absolute; top: 11px; left: 50%;
      transform: translateX(-50%); width: 126px; height: 37px;
      border-radius: 24px; background: #000; z-index: 100;
    }
    .cm-home-indicator { display: block !important; }
  }
  /* Mobile: no frame, but reserve safe-area for status bar */

const RECOMMENDATIONS = Object.fromEntries(
  MOOD_ORDER.map((mood, mIdx) => [
    mood,
    Object.entries(FILM_SCORES)
      .map(([id, scores]) => ({ id, score: scores[mIdx] }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 12),
  ])
);

// Score lookup for combined-mood computation (covers ALL films, not just top-12).
function scoreFor(filmId, moodId) {
  const mIdx = MOOD_ORDER.indexOf(moodId);
  return FILM_SCORES[filmId]?.[mIdx] ?? 50;
}

// ─── FIT-TO-CONTAINER HOOK ───────────────────────────────────────────
// Returns a ref to attach to the phone element. Sets --cm-fit on phone
// based on container vs. design (390x844) so content always fits.
function useFitToPhone() {
  const ref = React.useRef(null);
  React.useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const fit = () => {
      const r = el.getBoundingClientRect();
      const scale = Math.min(r.width / 390, r.height / 844, 1);
      el.style.setProperty('--cm-fit', String(scale));
    };
    fit();
    const ro = new ResizeObserver(fit);
    ro.observe(el);
    window.addEventListener('resize', fit);
    return () => { ro.disconnect(); window.removeEventListener('resize', fit); };
  }, []);
  return ref;
}

// ─── LIVE CLOCK HOOK ─────────────────────────────────────────────────
function useNow() {
  const [now, setNow] = React.useState(new Date());
  React.useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000 * 15);
    return () => clearInterval(id);
  }, []);
  return now;
}

const MONTHS = ['janv.', 'févr.', 'mars', 'avril', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
function formatTime(d) { return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function formatDate(d) { return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }

    case 'wave':
      return (<svg width={s} height={s} viewBox="0 0 36 36" fill="none">
        <path d="M4 14 Q9 9 14 14 T24 14 T34 14" stroke={color} strokeWidth="1.2" strokeLinecap="round"/>
        <path d="M4 21 Q9 16 14 21 T24 21 T34 21" stroke={color} strokeWidth="1.2" strokeLinecap="round" opacity="0.7"/>
        <path d="M4 28 Q9 23 14 28 T24 28 T34 28" stroke={color} strokeWidth="1.2" strokeLinecap="round" opacity="0.4"/>
      </svg>);
    case 'moon':
      return (<svg width={s} height={s} viewBox="0 0 36 36" fill="none">
        <path d="M22 6 A12 12 0 1 0 30 22 A9 9 0 0 1 22 6 Z" stroke={color} strokeWidth="1.2" strokeLinejoin="round"/>
        <circle cx="9" cy="10" r="0.8" fill={color}/><circle cx="6" cy="20" r="0.6" fill={color}/>
      </svg>);
    case 'smile':
      return (<svg width={s} height={s} viewBox="0 0 36 36" fill="none">
        <circle cx="18" cy="18" r="12" stroke={color} strokeWidth="1.2"/>
        <path d="M12 20 Q18 26 24 20" stroke={color} strokeWidth="1.2" strokeLinecap="round" fill="none"/>
        <circle cx="13" cy="14" r="1" fill={color}/><circle cx="23" cy="14" r="1" fill={color}/>
      </svg>);
    case 'sparkle':
      return (<svg width={s} height={s} viewBox="0 0 36 36" fill="none">
        <path d="M18 4 L20 16 L32 18 L20 20 L18 32 L16 20 L4 18 L16 16 Z" stroke={color} strokeWidth="1.2" strokeLinejoin="round"/>
        <path d="M28 6 L29 10 L33 11 L29 12 L28 16 L27 12 L23 11 L27 10 Z" stroke={color} strokeWidth="0.9" strokeLinejoin="round" opacity="0.6"/>
      </svg>);
    default: return null;
  }
}

// ─── SCORE ARC ───────────────────────────────────────────────────────
function ScoreArc({ score, size = 52, stroke = 3 }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const dash = (score / 100) * c;
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={`${CREAM}15`} strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={RED} strokeWidth={stroke} fill="none"
          strokeDasharray={`${dash} ${c}`} strokeLinecap="round"
          style={{ transition: 'stroke-dasharray 0.8s cubic-bezier(.2,.7,.2,1)' }}/>
      </svg>
      <div style={{
        position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: '"Cormorant Garamond", serif', fontStyle: 'italic',
        color: CREAM, fontSize: size > 60 ? 22 : 16, fontWeight: 500,
      }}>
        <span>{score}<span style={{ fontSize: '0.55em', color: RED, marginLeft: 1 }}>%</span></span>
      </div>
    </div>
  );
}

function Bracket({ pos }) {
  const s = 12;
  const base = { position: 'absolute', width: s, height: s, borderColor: RED, borderStyle: 'solid' };
  const styles = {
    tl: { ...base, top: 8, left: 8, borderWidth: '1px 0 0 1px' },
    tr: { ...base, top: 8, right: 8, borderWidth: '1px 1px 0 0' },
    bl: { ...base, bottom: 8, left: 8, borderWidth: '0 0 1px 1px' },
    br: { ...base, bottom: 8, right: 8, borderWidth: '0 1px 1px 0' },
  };
  return <div style={styles[pos]}/>;
}

        }}>
          <Bracket pos="tl"/><Bracket pos="tr"/><Bracket pos="bl"/><Bracket pos="br"/>
          <div style={{ fontSize: 9, letterSpacing: 3, color: RED, textTransform: 'uppercase', fontWeight: 600, marginBottom: 18, textAlign: 'center' }}>· Choix du soir ·</div>
          <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
            <div style={{ fontFamily: '"Bebas Neue", sans-serif', fontSize: 84, lineHeight: 0.78, color: RED, textShadow: `0 0 24px ${RED}55`, flexShrink: 0 }}>01</div>
            <div style={{ flex: 1, minWidth: 0, paddingTop: 4 }}>
              <div style={{ fontFamily: '"Cormorant Garamond", serif', fontSize: 34, fontStyle: 'italic', color: CREAM, lineHeight: 0.95, letterSpacing: 0.5 }}>{topFilm.title}</div>
              <div style={{ fontSize: 10, color: `${CREAM}80`, marginTop: 8, letterSpacing: 1.5, textTransform: 'uppercase' }}>{topFilm.studio} · {topFilm.year} · {topFilm.runtime}</div>
              <div style={{ fontSize: 12.5, color: `${CREAM}b0`, marginTop: 12, lineHeight: 1.4, fontStyle: 'italic' }}>« {topFilm.tagline} »</div>
            </div>
          </div>
          <div style={{ marginTop: 18, paddingTop: 16, borderTop: `1px solid ${CREAM}15`, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div>
              <div style={{ fontSize: 9, letterSpacing: 2.5, color: `${CREAM}70`, textTransform: 'uppercase' }}>Compatibilité</div>
              <div style={{ fontFamily: '"Cormorant Garamond", serif', fontSize: 13, fontStyle: 'italic', color: CREAM, marginTop: 3 }}>
                {moods.length > 1 ? 'Aligné avec vos humeurs combinées' : 'Parfaitement aligné avec votre humeur'}
              </div>
            </div>
            <ScoreArc score={top.score} size={62} stroke={2.5}/>
          </div>
          <button style={{
            marginTop: 18, width: '100%', padding: 12, background: RED, color: CREAM, border: 'none', borderRadius: 2,
            fontSize: 11, fontWeight: 600, letterSpacing: 2.5, textTransform: 'uppercase', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
            boxShadow: `0 6px 20px ${RED}40`,
          }}>
            <svg width="10" height="10" viewBox="0 0 10 10"><polygon points="1,0 9,5 1,10" fill={CREAM}/></svg>
            Regarder
          </button>
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
          <div style={{ flex: 1, height: 1, background: `${CREAM}15` }}/>
          <div style={{ fontSize: 9, letterSpacing: 3, color: `${CREAM}80`, textTransform: 'uppercase' }}>Autres correspondances</div>
          <div style={{ flex: 1, height: 1, background: `${CREAM}15` }}/>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {rest.map((r, i) => {
            const f = FILMS[r.id];
            const rank = String(i + 2).padStart(2, '0');
            return (
              <div key={r.id} style={{
                display: 'flex', alignItems: 'center', gap: 16,
                padding: '14px 14px', borderRadius: 4,
                background: `${CREAM}04`, border: `1px solid ${CREAM}0d`, borderLeft: `2px solid ${RED}40`,
                cursor: 'pointer',
              }}>
                <div style={{ fontFamily: '"Bebas Neue", sans-serif', fontSize: 32, lineHeight: 1, color: `${CREAM}50`, flexShrink: 0, width: 32, textAlign: 'center' }}>{rank}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: '"Cormorant Garamond", serif', fontSize: 21, fontStyle: 'italic', color: CREAM, lineHeight: 1 }}>{f.title}</div>
                  <div style={{ fontSize: 9, color: `${CREAM}70`, marginTop: 5, letterSpacing: 1.4, textTransform: 'uppercase' }}>{f.studio} · {f.year} · {f.runtime}</div>
                  <div style={{ fontSize: 11, color: `${CREAM}90`, marginTop: 5, fontStyle: 'italic', lineHeight: 1.3 }}>{f.tagline}</div>
                </div>
                <ScoreArc score={r.score} size={48} stroke={2}/>
              </div>
            );
          })}
        </div>

        <div style={{ textAlign: 'center', marginTop: 22, fontSize: 9, letterSpacing: 4, color: `${CREAM}40`, textTransform: 'uppercase' }}>— Fin de la sélection —</div>
      </div>
    </div>
  );
}

// ─── ROOT APP ────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = React.useState('home');
  const [selectedMoods, setSelectedMoods] = React.useState([]);
  const [opening, setOpening] = React.useState(false);
  const now = useNow();
  const phoneRef = useFitToPhone();

  const openApp = () => {
    setOpening(true);
    setTimeout(() => { setScreen('mood'); setOpening(false); }, 380);
  };
  const toggleMood = (id) => {
    setSelectedMoods(prev => prev.includes(id) ? prev.filter(m => m !== id) : [...prev, id]);
  };
  const goToSuggestions = () => { if (selectedMoods.length > 0) setScreen('suggestions'); };
  const goBackToMood = () => setScreen('mood');
  const goHome = () => { setScreen('home'); setSelectedMoods([]); };

  return (
    <div className="cm-stage">
      <div className="cm-phone" ref={phoneRef}>
        <div className="cm-canvas">
          <StatusBar time={formatTime(now)}/>

          {/* Home indicator */}
          <div className="cm-home-indicator" style={{
            display: 'none',
            position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
            width: 139, height: 5, borderRadius: 100, zIndex: 100,
            background: screen === 'home' ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.5)',
          }}/>

          {/* All screens stack with crossfade */}
          <div style={{ position: 'absolute', inset: 0 }}>
            {screen === 'home' && (
              <div style={{ position: 'absolute', inset: 0, opacity: opening ? 0 : 1, transform: opening ? 'scale(1.1)' : 'scale(1)', transition: 'opacity 0.38s ease, transform 0.38s ease' }}>
                <HomeScreen onOpenApp={openApp}/>
              </div>
            )}
            {(screen === 'mood' || opening) && screen !== 'suggestions' && (
              <div style={{ position: 'absolute', inset: 0, opacity: opening ? 0 : 1, transform: opening ? 'scale(0.92)' : 'scale(1)', transition: 'opacity 0.38s ease, transform 0.38s ease', pointerEvents: opening ? 'none' : 'auto' }}>
                {screen === 'mood' && (
                  <MoodScreen
                    selected={selectedMoods}
                    onToggle={toggleMood}
                    onContinue={goToSuggestions}
                    onHome={goHome}
                  />
                )}
              </div>
            )}
            {screen === 'suggestions' && (
              <SuggestionsScreen moodIds={selectedMoods} onBack={goBackToMood}/>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
